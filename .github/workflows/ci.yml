name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every Node line still in support: 22 and 24 are LTS, 26 is current
        # (LTS on 2026-10-28). Node 20 went end-of-life on 2026-04-30.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # typecheck + lint + format:check + knip + coverage
      - run: npm run check
      - run: npm run build
