name: Release

# Publishes to npm when a version tag is pushed. The tag is the trigger and the
# single source of truth for the version: it must match package.json, which
# test/docs.test.ts already keeps in sync with src/version.ts.
#
#   npm version minor && git push --follow-tags
#
# Requires npm trusted publishing for this repo+workflow (npmjs.com > package >
# Settings > Trusted publisher). No NPM_TOKEN secret is needed; `id-token:
# write` below lets npm mint provenance attestations tying the tarball to this
# commit and workflow run.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # npm >= 11.5.1 is required for trusted publishing.
      - run: npm install -g npm@latest

      - name: Verify the tag matches package.json
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag_version but package.json says $pkg_version"
            exit 1
          fi

      # The very first release is published by hand (npm requires a package to
      # exist before a trusted publisher can be attached to it), so the v0.1.0
      # tag would otherwise land here and fail with a 403 for republishing an
      # existing version. Treat an already-published version as a no-op.
      - name: Check whether this version is already on the registry
        id: published
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "libplate@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::libplate@$version is already published; nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Same gate as CI, re-run against the exact commit being published.
      - if: steps.published.outputs.skip == 'false'
        run: npm run check

      # `prepack` builds, so this publishes a freshly compiled dist/.
      - if: steps.published.outputs.skip == 'false'
        run: npm publish --provenance
