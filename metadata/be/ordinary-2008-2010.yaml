schemaVersion: 1
id: BE_ORDINARY_2008_2010
country: BE
name: Série ancienne 123-ABC (2008-2010)
registrationType: ORDINARY
# Legacy for detection purposes only: Belgian plates follow the HOLDER, not
# the vehicle, so these plates remain fully valid in circulation today.
# Issued between the exhaustion of the ABC-123 series (2008) and the European
# format (2010-11-15); exact start date not pinned in the consolidated text.
legacySeries: true
vehicleInference:
  level: NOT_INFERABLE
normalization:
  uppercase: true
  acceptedSeparators:
    - " "
    - "-"
segments:
  - name: number
    type: DIGITS
    length: 3
  - name: letters
    type: LETTERS
    length: 3
formats:
  national: "{number}-{letters}"
  compact: "{number}{letters}"
visual:
  background: WHITE
  foreground: RED
sources:
  - id: BE-AM-2001
    section: "Art. 4, § 1er (anciens modèles)"
examples:
  valid:
    - "123-ABC"
    - "123 ABC"
  invalid:
    - "1234-ABC"
    - "12-ABC"
    - "ABC-123"
