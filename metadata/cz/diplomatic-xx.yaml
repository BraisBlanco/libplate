schemaVersion: 1
id: CZ_DIPLOMATIC_ADMIN
country: CZ
name: Registrační značka cizinecká — administrativně-technický personál (XX)
registrationType: DIPLOMATIC_STAFF
# See CZ_DIPLOMATIC: the position of the letter pair comes from the MZV
# diplomatic-protocol handbook in force since 2025-07-01.
validFrom: "2025-07-01"
normalization:
  uppercase: true
  acceptedSeparators:
    - " "
    - "-"
vehicleInference:
  level: CATEGORY_ONLY
  possibleCategories:
    - PASSENGER_CAR
    - MOTORCYCLE
    - MOPED_OR_MOTOR_CYCLE
  evidence:
    - type: PREFIX
      value: "XX (§ 24 odst. 3)"
segments:
  # § 24 odst. 3 gives the same shape as the CD series with the letters "XX":
  # 5 digits for automobiles, 4 for motorcycles, 3 for mopeds with pedals. The
  # MZV handbook places the pair "na šesté a sedmé pozici" — last, for the
  # 5-digit automobile mark. "XX" marks belong to the administrative and
  # technical staff of a mission enjoying limited privileges and immunities.
  - name: number
    type: DIGITS
    minLength: 3
    maxLength: 5
  - name: status
    type: LITERAL
    value: XX
formats:
  national: "{number} {status}"
  compact: "{number}{status}"
visual:
  background: WHITE
  foreground: BLUE
sources:
  - id: CZ-VYHL-343
    section: "§ 23 písm. a) bod 3; § 24 odst. 3; § 29 odst. 2 písm. c) bod 2"
  - id: CZ-MZV-DIPL
    section: "1.1"
examples:
  valid:
    - "12345 XX"
    - "00001 XX"
    - "1234 XX"
    - "123XX"
  invalid:
    - "12 XX"
    - "123456 XX"
    - "XX 12345"
    - "12345 XS"
