schemaVersion: 1
id: EE_STANDARD
country: EE
name: Üldkasutatav autode ja haagiste registreerimismärk (tüüp A1)
registrationType: ORDINARY
# validFrom is deliberately omitted: the three-digit + three-letter composition
# predates määrus nr 49 (in force 2011-07-01) — it is the series Estonia has
# issued since the early 1990s — and no earlier act fixing it was traced.
# § 7¹ lõige 2 confirms marks issued before 2004-07-01 need not be replaced.
normalization:
  uppercase: true
  acceptedSeparators:
    - " "
    - "-"
vehicleInference:
  # Lisa 1: type A1 serves vehicle categories M, N and O — cars, buses, trucks
  # and trailers, but not mopeds/motorcycles (B1-B3) or tractors (E1/E2).
  level: CATEGORY_ONLY
  possibleCategories:
    - PASSENGER_CAR
    - VAN
    - TRUCK
    - BUS
    - TRAILER_OR_SEMITRAILER
  evidence:
    - type: PATTERN
      value: "three digits + three letters (mark type A1, lisa 1 and lisa 3 näidis 1)"
segments:
  # § 3 lõige 1: the numbers field and the letters field are separate fields on
  # the plate; lisa 3 näidis 1 ("053 EEN") fixes three digits and three
  # letters. No official text restricts the digit range, and leading zeros are
  # part of the sample, so 000-999 is accepted.
  - name: number
    type: DIGITS
    length: 3
  # § 3 lõige 5: Latin capitals. The full alphabet is used; Estonian letters
  # with diacritics (Ä, Ö, Õ, Ü) are not Latin basic and never appear.
  #
  # Known limitation: § 6 also caps how often the WIDE letters may occur on an
  # A1 plate — "A" and "M" at most twice each, "W" at most once, and A, M and W
  # never together (lõiked 2-5). Those multiplicity limits are not modelled;
  # they would need ~80 whole-segment exclusions. Plain letter bans ARE
  # modelled on the schemes that have them (EE_STANDARD_REDUCED, EE_MOTORCYCLE,
  # EE_MOPED, EE_TRACTOR).
  - name: letters
    type: LETTERS
    length: 3
formats:
  national: "{number} {letters}"
  compact: "{number}{letters}"
# Lisa 1: white background, black symbols. The SAME composition appears on a
# YELLOW background with black symbols when the vehicle is registered for a
# fixed term (§ 7 lõige 1), so the colours below are the default case only.
visual:
  background: WHITE
  foreground: BLACK
sources:
  - id: EE-M49
    section: "§ 2 lg 1 p 1; § 3; § 6; lisa 1; lisa 3 näidis 1"
  - id: EE-M19
    section: "§ 14"
  - id: EE-LS
    section: "§ 76 lg 13"
examples:
  valid:
    - "053 EEN"
    - "123 ABC"
    - "000 AAA"
    - "999-ZZZ"
  invalid:
    - "12 ABC"
    - "1234 ABC"
    - "053 EE"
    - "053 EENN"
    - "ABC 053"
