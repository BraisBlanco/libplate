schemaVersion: 1
id: ES_TOURIST
country: ES
name: Matrícula turística (prefijo T)
registrationType: TOURIST
validFrom: "1999-07-26"
vehicleInference:
  # Tourist regime, not a vehicle category.
  level: NOT_INFERABLE
normalization:
  uppercase: true
  acceptedSeparators:
    - " "
    - "-"
segments:
  - name: prefix
    type: LITERAL
    value: T
  - name: serial
    type: DIGITS
    length: 4
  - name: series
    type: CHARSET
    length: 3
    characters: BCDFGHJKLMNPRSTVWXYZ
formats:
  national: "{prefix} {serial} {series}"
  compact: "{prefix}{serial}{series}"
visual:
  # White background, black characters, with a red vertical band carrying the
  # month/year of expiry.
  background: WHITE
  foreground: BLACK
sources:
  - id: ES-RGV
    section: "Anexo XVIII, I.B.b"
examples:
  valid:
    - "T 1234 BCD"
    - "T-1234-BCD"
  invalid:
    - "T 123 BCD"
    - "T 1234 AEI"
    - "1234 BCD"
