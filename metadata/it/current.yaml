schemaVersion: 1
id: IT_CURRENT
country: IT
name: Targa automobilistica ordinaria (AA 000 AA)
registrationType: ORDINARY
validFrom: "1994-01-01"
vehicleInference:
  # The alphanumeric national series is shared across vehicle categories.
  level: NOT_INFERABLE
normalization:
  uppercase: true
  acceptedSeparators:
    - " "
    - "-"
segments:
  # The letters I, O, Q and U are not used, to avoid confusion with digits and
  # with one another.
  - name: letters1
    type: LETTERS
    length: 2
    excluded: [I, O, Q, U]
  - name: digits
    type: DIGITS
    length: 3
  - name: letters2
    type: LETTERS
    length: 2
    excluded: [I, O, Q, U]
formats:
  national: "{letters1} {digits} {letters2}"
  compact: "{letters1}{digits}{letters2}"
visual:
  background: WHITE
  foreground: BLACK
sources:
  - id: IT-CDS
    section: "Art. 93"
  - id: IT-REG
    section: "Artt. 254-258"
examples:
  valid:
    - "AA 000 AA"
    - "AB 123 CD"
    - "ZZ 999 ZZ"
  invalid:
    - "AA 00 AA"
    - "IA 123 AA"
    - "AQ 123 AA"
    - "AA 1234 AA"
