schemaVersion: 1
id: LT_HISTORIC
country: LT
name: Istorinės transporto priemonės numerio ženklas — M ir N kategorijos (H + penki skaitmenys)
registrationType: HISTORICAL
# validFrom omitted — see LT_ELECTRIC.
normalization:
  uppercase: true
  acceptedSeparators:
    - " "
    - "-"
vehicleInference:
  # 21.6.1 p. is the M and N branch of the historic composition; the L branch
  # takes the mirror-image shape and is LT_HISTORIC_L.
  level: CATEGORY_ONLY
  possibleCategories:
    - PASSENGER_CAR
    - VAN
    - TRUCK
    - BUS
  evidence:
    - type: PREFIX
      value: "H (21.6.1 p., historic M and N categories)"
segments:
  # 21.6.1 p.: one letter and five digits, "pirmoji turi būti „H“ raidė".
  - name: prefix
    type: LITERAL
    value: "H"
  - name: number
    type: DIGITS
    length: 5
formats:
  national: "{prefix} {number}"
  compact: "{prefix}{number}"
# 1 priedas 1 p. lists historic plates with the ordinary ones: white film, EU
# sign, black characters.
visual:
  background: WHITE
  foreground: BLACK
sources:
  - id: LT-TAISYKLES
    section: "19.6, 21, 21.6.1 p.; 1 priedas 1 p."
  - id: LT-SEAKI
    section: "10 str. 5 d. 2 p."
examples:
  valid:
    - "H 12345"
    - "H 00000"
    - "H 99999"
    - "H54321"
  invalid:
    - "H 1234"
    - "H 123456"
    - "T 12345"
    - "HH 1234"
    - "12345 H"
