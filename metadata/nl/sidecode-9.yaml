    type: DIGITS
    length: 3
  - name: letters2
    type: LETTERS
    length: 1
    excluded: [A, C, E, I, M, O, Q, U, W]
formats:
  national: "{letters1}-{digits}-{letters2}"
  compact: "{letters1}{digits}{letters2}"
visual:
  background: YELLOW
  foreground: BLACK
sources:
