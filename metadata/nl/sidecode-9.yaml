schemaVersion: 1
id: NL_SIDECODE_9
country: NL
name: Serie XX-999-X (sidecode 9, desde 2006)
registrationType: ORDINARY
# First issued for mopeds 2006-08-11; light commercial 2012-12-12; cars
# 2015-03-30.
validFrom: "2006-08-11"
vehicleInference:
  level: NOT_INFERABLE
normalization:
  uppercase: true
  acceptedSeparators:
    - " "
    - "-"
segments:
  - name: letters1
    type: LETTERS
    length: 2
    excluded: [A, C, E, I, M, O, Q, U, W]
  - name: digits
    type: DIGITS
    length: 3
  - name: letters2
    type: LETTERS
    length: 1
    excluded: [A, C, E, I, M, O, Q, U, W]
formats:
  national: "{letters1}-{digits}-{letters2}"
  compact: "{letters1}{digits}{letters2}"
visual:
  background: YELLOW
  foreground: BLACK
sources:
  - id: NL-KENTEKEN
  - id: NL-REGELING
    section: "Art. 1"
  - id: NL-RDW-SERIES
  - id: NL-RDW-LETTERS
examples:
  valid:
    - "GB-001-B"
    - "GB 001 B"
  invalid:
    - "GB-01-B"
    - "GA-001-B"
    - "GBB-001-B"
