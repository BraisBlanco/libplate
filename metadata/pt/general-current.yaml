schemaVersion: 1
id: PT_GENERAL_CURRENT
country: PT
name: Série geral atual (AA 00 AA)
registrationType: ORDINARY
validFrom: "2020-03-03"
vehicleInference:
  # The general series is shared across cars, motorcycles, mopeds, tricycles
  # and quadricycles; the text narrows nothing.
  level: NOT_INFERABLE
normalization:
  uppercase: true
  acceptedSeparators:
    - " "
    - "-"
segments:
  # NOTE: the current series restricts vowels in certain letter positions, with
  # exceptions (e.g. the first plate was AA-01-AA). That positional rule is not
  # yet modelled — the full A-Z alphabet is accepted to avoid rejecting valid
  # plates. See PT-IMT-NEW. To be tightened with a richer grammar later.
  - name: letters1
    type: LETTERS
    length: 2
  - name: digits
    type: DIGITS
    length: 2
  - name: letters2
    type: LETTERS
    length: 2
formats:
  national: "{letters1} {digits} {letters2}"
  compact: "{letters1}{digits}{letters2}"
visual:
  background: WHITE
  foreground: BLACK
sources:
  - id: PT-RULES
    section: "Artigo 3.º"
  - id: PT-2020
  - id: PT-IMT-ID
examples:
  valid:
    - "AA 01 AA"
    - "AA-01-AA"
    - "BB 12 CD"
    - "ZZ 99 ZZ"
  invalid:
    - "AA 1 AA"
    - "A0 00 AA"
    - "AA 00 A"
    - "1A 00 AA"
    - "AA 000 AA"
