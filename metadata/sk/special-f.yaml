schemaVersion: 1
id: SK_SPECIAL_F
country: SK
name: Zvláštne evidenčné číslo obsahujúce písmeno F — vozidlo s obmedzenou prevádzkou (F 12345)
registrationType: SPECIAL
# legacySeries: see SK_SPECIAL_C for the shared reason.
legacySeries: true
# validFrom omitted — see SK_SPECIAL_C.
normalization:
  uppercase: true
  acceptedSeparators:
    - " "
    - "-"
vehicleInference:
  # § 127 ods. 1 písm. b) and ods. 4: the holder is a "jednotlivé vozidlo s
  # obmedzenou prevádzkou", a status under the vehicle-operation act rather than
  # a vehicle category.
  level: NOT_INFERABLE
segments:
  # § 127 ods. 2, as for the C series.
  - name: kind
    type: LITERAL
    value: F
  - name: number
    type: CHARSET
    length: 5
    characters: 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
formats:
  national: "{kind} {number}"
  compact: "{kind}{number}"
# § 35 ods. 10 of the vyhláška. The validity period marked on the plate
# (§ 127 ods. 4) is not part of the number.
visual:
  background: WHITE
  foreground: BLACK
sources:
  - id: SK-ZCP
    section: "§ 127 ods. 1 písm. b), ods. 2, ods. 4, ods. 9 písm. a)"
  - id: SK-VYHL-9
    section: "§ 35 ods. 5, 8, 10"
examples:
  valid:
    - "F 12345"
    - "F-A1B2C"
  invalid:
    - "F 1234"
    - "F 123456"
    - "C 12345"
