schemaVersion: 1
id: SK_SPECIAL_S
country: SK
name: Zvláštne evidenčné číslo obsahujúce písmeno S — športové vozidlo (S 12345)
registrationType: SPECIAL
# legacySeries: see SK_SPECIAL_C for the shared reason.
legacySeries: true
# validFrom omitted — see SK_SPECIAL_C.
normalization:
  uppercase: true
  acceptedSeparators:
    - " "
    - "-"
vehicleInference:
  # § 127 ods. 7 restricts the plate to a "športové vozidlo" — a status carried
  # by FIA or FIM papers (ods. 9 písm. d)), not a vehicle category. A sports
  # motorcycle and a rally car take the same series.
  level: NOT_INFERABLE
segments:
  # § 127 ods. 2. S, like H, may be laid out on one row.
  - name: kind
    type: LITERAL
    value: S
  - name: number
    type: CHARSET
    length: 5
    characters: 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
formats:
  national: "{kind} {number}"
  compact: "{kind}{number}"
# § 35 ods. 10 of the vyhláška.
visual:
  background: WHITE
  foreground: BLACK
sources:
  - id: SK-ZCP
    section: "§ 127 ods. 1 písm. e), ods. 2, ods. 7, ods. 9 písm. d); § 130 ods. 1"
  - id: SK-VYHL-9
    section: "§ 35 ods. 5, 8, 10"
examples:
  valid:
    - "S 12345"
    - "S-12AB3"
  invalid:
    - "S 1234"
    - "S 123456"
    - "H 12345"
